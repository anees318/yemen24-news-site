<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>يمن 24 – الحدث بين يديك</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>أحدث الأخبار</h1>
  <div id="news-container"></div>

  <script>
    fetch("https://opensheet.elk.sh/1fosYyTekU4pyUAg0qbMJlpTmkMZGheGf8CLpgtEJQMk/Sheet1")
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById("news-container");
        data.forEach(news => {
          const card = document.createElement("div");
          card.className = "news-card";
          card.innerHTML = `
            <h3>${news["القسم الرئيسي"]} - ${news["القسم الفرعي"]}</h3>
            <p><strong>${news["المصدر"]}</strong></p>
            <a href="${news["رابط المصدر"]}" target="_blank">قراءة الخبر</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById("news-container").innerText = "حدث خطأ أثناء تحميل الأخبار.";
        console.error(error);
      });
  </script>
</body>
</html>
